services:
  deliverator:
    image: ghcr.io/alexstansfield/deliverator:latest
    container_name: deliverator
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/data
    environment:
      # Serve under a sub-path, e.g. https://example.com/downloader (leave empty for root)
      - BASE_PATH=
      # Set to true if your qBittorrent/SABnzbd use self-signed HTTPS certificates
      - ALLOW_SELF_SIGNED_CERTS=false
      # Optional: fixed secret (64 hex chars). Generated into /data/secret.key when unset.
      # - SECRET_KEY=
